name: Build CV & Generate Previews

on:
  push:
    branches: [main]
    paths:
      - 'CV/src/**'
      - '.github/workflows/automate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile LaTeX & Generate PNG Previews
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile LaTeX (English CV)
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: CV/src
          root_file: cv_en.tex
          latexmk_use_xelatex: true
          extra_packages: fontawesome5

      - name: Compile LaTeX (Turkish CV)
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: CV/src
          root_file: cv_tr.tex
          latexmk_use_xelatex: true
          extra_packages: fontawesome5

      - name: Move PDFs to output directory
        run: |
          mkdir -p CV/output
          cp CV/src/cv_en.pdf "CV/output/Omer_Faruk_Gunay_CV_EN.pdf"
          cp CV/src/cv_tr.pdf "CV/output/Omer_Faruk_Gunay_CV_TR.pdf"

      - name: Install poppler (PDF to PNG)
        run: sudo apt-get install -y poppler-utils

      - name: Generate PNG Previews
        run: |
          pdftoppm -r 150 -png "CV/output/Omer_Faruk_Gunay_CV_EN.pdf" "CV/output/cv_en_preview"
          pdftoppm -r 150 -png "CV/output/Omer_Faruk_Gunay_CV_TR.pdf" "CV/output/cv_tr_preview"
          # Rename to clean names (single page CVs)
          mv "CV/output/cv_en_preview-1.png" "CV/output/cv_en_preview.png" 2>/dev/null || true
          mv "CV/output/cv_tr_preview-1.png" "CV/output/cv_tr_preview.png" 2>/dev/null || true

      - name: Commit & Push artifacts
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CV/output/
          git diff --cached --quiet || git commit -m "🤖 CV otomatik derlendi ve önizlemeler güncellendi"
          git push
